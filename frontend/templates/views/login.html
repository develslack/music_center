<div class="container">
    <div class="jumbotron">
        <div class="alert alert-info">
            <span class="glyphicon glyphicon-log-in" aria-hidden="true"></span> Ingreso</span>
        </div>
    <form id="form-login" method="POST">
        <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Ingrese su email" name="email">
        </div>
        <div class="form-group">
        <label for="pwd">Password:</label>
        <input type="password" class="form-control" id="password" placeholder="Ingrese su password" name="password">
        </div>
        <button type="submit" class="btn btn-primary"><span class="glyphicon glyphicon-ok" aria-hidden="true"></span> Ingresar</button>
        <button type="reset" class="btn btn-warning"><span class="glyphicon glyphicon-erase" aria-hidden="true"></span> Limpiar Formulario</button>
    </form><hr>
        <div id="message_login"></div>
    </div>
</div>
